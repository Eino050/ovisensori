substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Tornado animaatio (vaakasuuntainen heilahdus ja pyörteily)
      float tw = sin(millis() / 180.0f);
      int cx = 102 + (int)(tw * 6.0f);

      // Suppilon leveä suu / pilvi (ylhäällä)
      it.filled_rectangle(cx - 14, 8, 28, 4);
      it.filled_rectangle(cx - 11, 12, 22, 3);

      // Suppilo: pinottuja katkonaisia vaakaviivoja jotka kapenevat vyötäröön
      for (int i = 0; i < 9; i++) {
        int y = 15 + i * 3;
        int w = 10 - i;
        int sway = (int)(tw * (2 + i * 0.8f));
        it.line(cx - w + sway, y, cx + w + sway, y + 2);
      }

      // Tornadon alareuna pölyä (leveäntyvä, nostaa maassa)
      it.filled_rectangle(cx - 9, 44, 18, 3);
      it.filled_rectangle(cx - 11, 47, 22, 3);
      it.filled_rectangle(cx - 13, 50, 26, 3);
      it.filled_rectangle(cx - 13, 53, 26, 2);

font:
  - file: "gfonts://Montserrat"
    id: font_large
    size: 20

  - file: "gfonts://Montserrat"
    id: font_small
    size: 14

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
