substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // Kello isolla sekuntitarkkuudella
      it.strftime(0, 4, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa
      if ((millis() / 5000) % 2 == 0) {
        it.strftime(0, 46, id(font_small), "%y/%m/%d", now);
      } else {
        it.strftime(0, 46, id(font_small), "%H:%M:%S", now);
      }

      // Kalastava hahmo joka istuu näytön oikeassa reunassa
      it.filled_circle(116, 34, 5);               // pää
      it.filled_rectangle(112, 39, 3, 8);         // vartalo
      it.filled_rectangle(109, 47, 8, 2);         // istuin (reidet)
      it.line(115, 47, 110, 52);                  // vasen sääri (riippuu)
      it.line(118, 47, 124, 52);                  // oikea sääri
      it.line(114, 39, 100, 24);                  // käsi ylhäälle (vapa)
      it.line(100, 24, 104, 24);                  // vavan kärki
      it.line(97, 26, 60, 44);                    // siima kohti päivämäärää

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

  - file: "gfonts://Roboto"
    id: font_small
    size: 16

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
