substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Kalastava hahmo joka istuu näytön oikeassa reunassa
      it.filled_circle(116, 34, 5);               // pää
      it.filled_rectangle(109, 27, 14, 2);        // hatun lieri
      it.filled_circle(116, 27, 5);               // hatun kupu
      it.filled_rectangle(112, 39, 3, 8);         // vartalo
      it.filled_rectangle(109, 47, 8, 2);         // istuin (reidet)
      it.line(115, 47, 110, 52);                  // vasen sääri (riippuu)
      it.line(118, 47, 124, 52);                  // oikea sääri
      it.line(114, 39, 100, 24);                  // käsi ylhäälle (vapa)
      it.line(100, 24, 104, 24);                  // vavan kärki

      // Siima suorana eteenpäin (vasemmalle) alalaitaan, pieni veto ylös-alas
      float bob = sin(millis() / 300.0f) * 2.0f;
      int line_bottom_x = 92;
      int line_bottom_y = 60 + (int)(bob * 0.5f);
      it.line(100, 24, line_bottom_x, line_bottom_y);
      it.line(line_bottom_x, line_bottom_y, line_bottom_x, line_bottom_y + 2);

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

  - file: "gfonts://Roboto"
    id: font_small
    size: 16

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
