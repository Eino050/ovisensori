substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Kalastava hahmo joka istuu näytön oikeassa reunassa
      // Dreamworks-tyylinen kalastajahahmo (profiili katsellen vasemmalle)
      it.filled_circle(115, 32, 7);               // iso pää
      it.filled_triangle(109, 29, 99, 35, 109, 38);  // terävä nenäprofiili eteen
      it.filled_triangle(106, 37, 98, 48, 113, 44);  // iso alaleuka/leuka
      it.filled_rectangle(113, 44, 15, 9);        // vartalo/kroppa
      it.filled_rectangle(110, 44, 5, 9);         // vartalon etuosa
      it.filled_rectangle(108, 53, 9, 2);         // istuin (reidet)
      it.line(114, 53, 108, 58);                  // vasen sääri (roikkuu)
      it.line(117, 53, 123, 58);                  // oikea sääri
      it.filled_rectangle(120, 42, 4, 7);         // selkä
      it.line(115, 27, 124, 27);                  // hatun lieri
      it.filled_rectangle(112, 23, 7, 5);         // hatun kupu
      it.filled_circle(112, 31, 1);               // silmä
      it.line(110, 45, 100, 26);                  // käsi ylhäälle (vapa)
      it.line(100, 26, 104, 26);                  // vavan kärki

      // Siima suorana eteenpäin (vasemmalle) alalaitaan, pieni veto ylös-alas
      float bob = sin(millis() / 300.0f) * 2.0f;
      int line_bottom_x = 92;
      int line_bottom_y = 60 + (int)(bob * 0.5f);
      it.line(104, 26, line_bottom_x, line_bottom_y);
      it.line(line_bottom_x, line_bottom_y, line_bottom_x, line_bottom_y + 2);

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

  - file: "gfonts://Roboto"
    id: font_small
    size: 16

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
