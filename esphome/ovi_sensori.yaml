substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Pilvi ylhäällä (oikealla), josta satavat nopeat sadepisarat
      it.filled_rectangle(80, 4, 44, 6);
      it.filled_rectangle(86, 2, 34, 4);
      it.filled_circle(83, 8, 3);
      it.filled_circle(122, 8, 3);

      // Nopeat sadepisarat putoavat pilvestä
      for (int i = 0; i < 12; i++) {
        int x = 84 + (i * 29) % 36;
        int speed = 30 + (i * 13) % 25;         // eri putoamisnopeudet
        long pos = (millis() / speed + i * 17) % 42;
        int y = 12 + (int)pos;
        int len = (i % 3) + 1;                   // pisaran pituus 1-3px
        it.line(x, y, x, y + len);
      }

font:
  - file: "gfonts://Montserrat"
    id: font_large
    size: 20

  - file: "gfonts://Montserrat"
    id: font_small
    size: 14

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
