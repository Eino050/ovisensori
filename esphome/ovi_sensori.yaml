substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Matrix-sade: erikokoisia merkkejä putoilee oikealle alueelle
      const char matrix_chars[] = "01AЮЖ$#*+?<>W@";
      for (int i = 0; i < 5; i++) {
        int x = 84 + i * 9;
        int speed = 60 + (i * 23) % 70;         // eri putoamisnopeudet
        long pos = (millis() / speed + (i * 37)) % 34;
        int y = 4 + (int)pos;
        int size = i % 3;                        // 0=pieni, 1=keski, 2=iso
        char c = matrix_chars[((millis() / 130 + i * 7) % 13)];
        switch (size) {
          case 0: it.printf(x, y, id(font_tiny), "%c", c); break;
          case 1: it.printf(x, y, id(font_small), "%c", c); break;
          case 2: it.printf(x, y, id(font_large), "%c", c); break;
        }
      }

font:
  - file: "gfonts://Montserrat"
    id: font_large
    size: 20

  - file: "gfonts://Montserrat"
    id: font_small
    size: 14

  - file: "gfonts://Montserrat"
    id: font_tiny
    size: 10

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
