substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Matrix-sade: kiinalaisia merkkejä putoilee jononä jonoina (3-6 merkkiä)
      static const char *han[] = {"你", "好", "世", "界", "龙", "天", "风",
                                  "水", "雨", "火", "金", "木", "土", "日",
                                  "月", "星", "文", "海"};
      for (int i = 0; i < 5; i++) {
        int x = 82 + i * 9;
        int speed = 90 + (i * 23) % 60;                 // eri putoamisnopeudet
        int chainLen = 3 + ((i + (millis() / 1000)) % 4);   // 3-6 merkkiä
        long base = (millis() / speed + i * 53) % 60;
        for (int k = 0; k < chainLen; k++) {
          int y = 2 + (int)(base + k * 7) % 40;
          int size = (i + k) % 3;                       // 0=pieni, 1=keski, 2=iso
          int idx = (millis() / 120 + i * 11 + k * 17) % 18;
          const char *c = han[idx];
          switch (size) {
            case 0: it.printf(x, y, id(font_tiny), "%s", c); break;
            case 1: it.printf(x, y, id(font_small), "%s", c); break;
            case 2: it.printf(x, y, id(font_large), "%s", c); break;
          }
        }
      }

font:
  - file: "gfonts://Noto Sans SC"
    id: font_large
    size: 20
    glyphs: "0123456789:/你好世界龙天风雨水火金木土日月星文海"

  - file: "gfonts://Noto Sans SC"
    id: font_small
    size: 14
    glyphs: "0123456789:/你好世界龙天风雨水火金木土日月星文海"

  - file: "gfonts://Noto Sans SC"
    id: font_tiny
    size: 10
    glyphs: "0123456789:/你好世界龙天风雨水火金木土日月星文海"

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
