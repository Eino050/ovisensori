substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Dreamworks-tyylinen kalastaja (profiili katsellen vasemmalle)
      // piirretään taaksepäin: vartalo -> pää -> kasvonpiirteet -> varusteet
      it.filled_rectangle(106, 42, 16, 10);       // torso
      it.filled_circle(112, 30, 8);               // iso pää
      it.filled_rectangle(110, 38, 5, 5);         // kaula (liittää pään ja torson)
      it.filled_triangle(102, 35, 94, 41, 104, 43);   // nenäprofiili eteen
      it.filled_triangle(105, 38, 99, 47, 112, 44);   // iso Dreamworks-leuka
      it.filled_circle(106, 29, 1);               // silmä
      it.filled_rectangle(105, 52, 10, 3);        // istuin/reidet
      it.line(106, 55, 100, 60);                  // vasen sääri roikkuu
      it.line(111, 55, 116, 60);                  // oikea sääri
      it.line(108, 42, 99, 25);                   // käsi ylhäälle vavan kanssa
      it.line(99, 25, 104, 25);                   // vavan kärki
      it.line(113, 22, 126, 22);                  // hatun lieri
      it.filled_rectangle(114, 17, 6, 6);         // hatun kupu

      // Siima suorana eteenpäin (vasemmalle) alalaitaan, pieni veto ylös-alas
      float bob = sin(millis() / 300.0f) * 2.0f;
      int line_bottom_x = 92;
      int line_bottom_y = 60 + (int)(bob * 0.5f);
      it.line(104, 25, line_bottom_x, line_bottom_y);
      it.line(line_bottom_x, line_bottom_y, line_bottom_x, line_bottom_y + 2);

font:
  - file: "gfonts://DejaVu Sans"
    id: font_large
    size: 20

  - file: "gfonts://DejaVu Sans"
    id: font_small
    size: 14

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
