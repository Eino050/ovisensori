substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Kalastaja: istuu taaksepäin nojaten, profiili vasemmalle (ei kasvonpiirteitä)
      it.filled_circle(117, 31, 6);               // pieni pyöreä pää
      it.filled_rectangle(119, 24, 8, 4);         // hiustyyli (kallistuu)
      it.filled_circle(122, 27, 3);               // hiustupsu
      it.filled_triangle(118, 35, 106, 46, 124, 44);   // torso nojaa taaksepäin
      it.filled_rectangle(122, 40, 6, 8);         // selkä/takavartalo
      it.line(108, 40, 103, 30);                  // käsi ojennettu ylös-eteen (pitää siimaa)
      it.line(112, 40, 104, 44);                  // toinen käsi vartalon edessä
      it.line(106, 46, 96, 40);                   // koukussa oleva jalka (polvi ylös)
      it.line(96, 40, 88, 46);                    // koukun sääri
      it.line(118, 46, 124, 46);                  // suora jalka eteenpäin
      it.line(124, 46, 124, 52);                  // suoran jalan alku
      it.filled_rectangle(86, 45, 6, 3);          // jalkaterä (koukkujalka)
      it.filled_rectangle(120, 51, 9, 3);         // jalkaterä (suora jalka)

      // Siima: suuri kaari oikealle hahmon ympärille (ei mene kellon/päivän päälle)
      const int hand_x = 103, hand_y = 30;
      it.line(hand_x, hand_y, 110, 21);
      it.line(110, 21, 119, 13);
      it.line(119, 13, 126, 7);
      it.line(126, 7, 121, 17);
      it.line(121, 17, 116, 29);
      it.line(116, 29, 112, 41);
      it.line(112, 41, 109, 50);
      it.line(109, 50, 107, 56);                   // siima maahan
      it.filled_circle(107, 57, 2);                // kiinnityspiste maassa
      it.line(102, 54, 98, 57);                    // värähtelyviivat maassa
      it.line(95, 60, 91, 62);
      it.line(112, 61, 109, 63);

font:
  - file: "gfonts://Montserrat"
    id: font_large
    size: 20

  - file: "gfonts://Montserrat"
    id: font_small
    size: 14

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
