substitutions:
  name: "ovi-kello"
  friendly_name: "Oven kello"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:

api:

ota:
  platform: esphome
  port: 3232
  password: !secret ota_password

web_server:
  port: 8080

time:
  - platform: sntp
    id: sntp_time
    servers:
      - murrikka.lan
      - 1.fi.pool.ntp.org
      - 2.fi.pool.ntp.org

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      auto now = id(sntp_time).now();

      // Piirrä koko kellonaika isolla
      it.strftime(0, 6, id(font_large), "%H:%M:%S", now);

      // Alarivi: päivämäärä lyhyessä muodossa (vain päivämäärä)
      it.strftime(0, 46, id(font_small), "%y/%m/%d", now);

      // Aurinko, jonka takaa hattarapilvi
      int cx = 105, cy = 9, r = 9;
      it.filled_circle(cx, cy, r);
      for (int a = 0; a < 8; a++) {
        float ang = a * 3.14159f / 4.0f;
        int x1 = cx + (int)(cos(ang) * (r + 2)), y1 = cy + (int)(sin(ang) * (r + 2));
        int x2 = cx + (int)(cos(ang) * (r + 5)), y2 = cy + (int)(sin(ang) * (r + 5));
        it.line(x1, y1, x2, y2);
      }

      // Hattarapilvi (päällekkäiset pyöreät kuplat) peittää auringon keskustan
      it.filled_circle(84, 11, 7);
      it.filled_circle(93, 7, 9);
      it.filled_circle(103, 5, 10);
      it.filled_circle(113, 6, 9);
      it.filled_circle(122, 10, 7);
      it.filled_rectangle(80, 12, 47, 8);

      // Sadepisarat putoavat pilvestä
      for (int i = 0; i < 30; i++) {
        int x = 82 + (i * 23) % 42;
        int speed = 6 + (i * 5) % 9;                 // nopea putoaminen
        long pos = (millis() / speed + i * 23) % 48;
        int y = 20 + (int)pos;
        int len = (i % 4) + 1;                        // pisaran pituus 1-4px
        it.line(x, y, x, y + len);
      }

font:
  - file: "gfonts://Montserrat"
    id: font_large
    size: 20

  - file: "gfonts://Montserrat"
    id: font_small
    size: 14

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi signaali"
    update_interval: 60s
